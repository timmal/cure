<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15202A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лечение">
<title>Лечение</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Лечение</h1>
    <nav class="days" id="days" aria-label="Дни курса"></nav>
  </header>
  <p class="note" id="note" role="alert" hidden></p>
  <main id="main"></main>
  <details class="ref" id="history">
    <summary>История</summary>
    <ol class="log" id="log" aria-label="Журнал отметок"></ol>
  </details>
  <footer class="foot">
    <p class="status" id="status" role="status"></p>
    <div class="foot-actions" id="footActions"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>
</div>
<script src="./data.js"></script>
<script src="./store.js"></script>
<script src="./app.js"></script>
</body>
</html>
